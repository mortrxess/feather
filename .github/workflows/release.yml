name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: Prepare dependencies (Xcode)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "${XCODE:-/Applications/Xcode_26.3.0.app}"
          xcodebuild -version

      # Xcode 26 sometimes crashes ("count of array differs from count of index set")
      # while resolving packages; resolve up front, retrying, into the same DerivedData `make` uses
      - name: Resolve Swift packages
        run: |
          for i in 1 2 3 4; do
            xcodebuild -resolvePackageDependencies \
              -project Feather.xcodeproj \
              -scheme Feather \
              -derivedDataPath "$TMPDIR/Feather/iphoneos" \
              -skipPackagePluginValidation && exit 0
            echo "Resolve attempt $i failed, retrying..."
            sleep 5
          done
          exit 1

      - name: Build
        run: |
          agvtool new-version -all $(git rev-parse HEAD)
          make iphoneos || { echo "Build failed, retrying once..."; make iphoneos; }

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: packages/*

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" _build/Payload/*.app/Info.plist)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v3.0.2
        with:
          name: Feather v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            packages/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
